<html>
    <head>
        <link rel="stylesheet" href="/static/css/style.css">
        <title>{{ .Title }}</title>
    </head>
    <body>
        <main>
        <h1>{{ .Title }}</h1>

        {{ if .Directories }}
            <ul class="repository-list">
                {{ range .Directories }}
                    <li>{{ . }}</li>
                {{ end }}
            </ul>
        {{ else }}
            <p>No repositories found.</p>
        {{ end }}
    </main>
    </body>
</html>
